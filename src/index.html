<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaNest — Local Media Library</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111318; }
      #root { width: 100%; height: 100%; visibility: hidden; }
      #root.app-ready { visibility: visible; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999; display: grid; overflow: hidden;
        place-items: center; color: #f4f5f8; background: #111318;
        font-family: system-ui, -apple-system, 'Microsoft YaHei', sans-serif;
        opacity: 1; transition: opacity 380ms ease, visibility 380ms ease;
      }
      #boot-splash.is-exiting { visibility: hidden; opacity: 0; pointer-events: none; }
      #boot-splash .splash-glow { position: absolute; width: 45vw; height: 45vw; border-radius: 50%; filter: blur(90px); opacity: .2; }
      #boot-splash .splash-glow-a { top: -25vw; left: -15vw; background: #5383f5; }
      #boot-splash .splash-glow-b { right: -18vw; bottom: -28vw; background: #9b6cff; }
      #boot-splash .splash-card {
        position: relative; display: flex; min-width: 220px; padding: 30px 36px 27px;
        align-items: center; flex-direction: column; gap: 10px; border: 1px solid #ffffff20;
        border-radius: 22px; background: #ffffff0d; box-shadow: 0 24px 70px #0008;
        backdrop-filter: blur(24px); animation: boot-card-in 620ms cubic-bezier(.2,.8,.2,1) both;
      }
      #boot-splash .splash-mark { display: grid; width: 52px; height: 52px; place-items: center; color: white; background: #5383f5; border-radius: 16px; box-shadow: 0 12px 30px #5383f560; }
      #boot-splash .splash-title { margin-top: 3px; font-size: 18px; font-weight: 700; letter-spacing: .01em; }
      #boot-splash .splash-subtitle { color: #a3a7b2; font-size: 12px; }
      #boot-splash .splash-progress { width: 136px; height: 3px; margin-top: 8px; overflow: hidden; border-radius: 99px; background: #ffffff24; }
      #boot-splash .splash-progress span { display: block; width: 42%; height: 100%; border-radius: inherit; background: #7398ff; animation: boot-progress 1.25s ease-in-out infinite; }
      @keyframes boot-card-in { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes boot-progress { 0% { transform: translateX(-140%); } 55%,100% { transform: translateX(330%); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash *, #boot-splash *::before, #boot-splash *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="splash-glow splash-glow-a"></div>
      <div class="splash-glow splash-glow-b"></div>
      <div class="splash-card">
        <div class="splash-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.8c0-.78.86-1.26 1.53-.85l10.1 6.2a1 1 0 0 1 0 1.7l-10.1 6.2A1 1 0 0 1 8 18.2V5.8Z"/></svg>
        </div>
        <div class="splash-title">MediaNest</div>
        <div class="splash-subtitle">正在准备本地媒体库</div>
        <div class="splash-progress" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
